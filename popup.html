<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 280px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e28;
      color: #f0f0f0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .setting {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-row label {
      margin-bottom: 0;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2d2d3c;
      transition: 0.2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #666;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: #6b5f8e;
    }
    input:checked + .slider:before {
      background: #f0f0f0;
      transform: translateX(18px);
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #2d2d3c;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #7b6f9e;
      border-radius: 50%;
      cursor: pointer;
    }
    .shortcut-input {
      width: 100%;
      padding: 8px 12px;
      background: #2d2d3c;
      border: 1px solid #3c3c4b;
      border-radius: 8px;
      color: #666;
      font-size: 13px;
      outline: none;
      cursor: not-allowed;
    }
    .shortcut-hint {
      font-size: 11px;
      color: #555;
      margin-top: 4px;
    }
    .shortcut-hint a {
      color: #7b6f9e;
      text-decoration: none;
    }
    .shortcut-hint a:hover {
      text-decoration: underline;
    }
    .status {
      font-size: 11px;
      font-weight: 500;
      color: #555;
      margin-top: 16px;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status.active {
      color: #7b6f9e;
    }
    hr {
      border: none;
      border-top: 1px solid #2d2d3c;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="shy">
    <h1>shy</h1>
  </div>

  <div class="setting">
    <div class="toggle-row">
      <label style="margin-bottom:0">Enable blur</label>
      <label class="toggle">
        <input type="checkbox" id="enableBlur">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="setting">
    <label>Blur intensity</label>
    <input type="range" id="blurIntensity" min="2" max="20" value="8">
  </div>

  <div class="setting">
    <label>Keyboard shortcut</label>
    <input type="text" class="shortcut-input" id="shortcut" value="Alt+S" readonly>
    <div class="shortcut-hint">
      Change at <a href="#" id="shortcutLink">chrome://extensions/shortcuts</a>
    </div>
  </div>

  <div class="setting">
    <div class="toggle-row">
      <label style="margin-bottom:0">Hover to reveal</label>
      <label class="toggle">
        <input type="checkbox" id="hoverReveal" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <hr>

  <div class="status" id="status">Active on ChatGPT</div>

  <script src="popup.js"></script>
</body>
</html>
