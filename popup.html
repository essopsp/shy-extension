<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .setting {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #aaa;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      transition: 0.2s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #10a37f;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #444;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #10a37f;
      border-radius: 50%;
      cursor: pointer;
    }
    .shortcut-input {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #888;
      font-size: 13px;
      outline: none;
      cursor: not-allowed;
    }
    .shortcut-hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    .shortcut-hint a {
      color: #10a37f;
      text-decoration: none;
    }
    .shortcut-hint a:hover {
      text-decoration: underline;
    }
    .status {
      font-size: 12px;
      color: #666;
      margin-top: 16px;
      text-align: center;
    }
    .status.active {
      color: #10a37f;
    }
    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10a37f" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
      <line x1="9" y1="9" x2="9.01" y2="9"/>
      <line x1="15" y1="9" x2="15.01" y2="9"/>
    </svg>
    shy
  </h1>

  <div class="setting">
    <div class="toggle-row">
      <label style="margin:0">Enable blur</label>
      <label class="toggle">
        <input type="checkbox" id="enableBlur">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="setting">
    <label>Blur intensity</label>
    <input type="range" id="blurIntensity" min="2" max="20" value="8">
  </div>

  <div class="setting">
    <label>Keyboard shortcut</label>
    <input type="text" class="shortcut-input" id="shortcut" value="Alt+S" readonly>
    <div class="shortcut-hint">
      Change at <a href="#" id="shortcutLink">chrome://extensions/shortcuts</a>
    </div>
  </div>

  <div class="setting">
    <div class="toggle-row">
      <label style="margin:0">Hover to reveal</label>
      <label class="toggle">
        <input type="checkbox" id="hoverReveal" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <hr>

  <div class="status" id="status">Active on ChatGPT</div>

  <script src="popup.js"></script>
</body>
</html>
